name: Challenge a call
description: A calibration example, pass criteria, or method rule you think gets it wrong
title: "[challenge] "
body:
  - type: input
    id: control
    attributes:
      label: Control ref
      description: For example GOV-01. See framework/controls.json.
      placeholder: GOV-01
    validations:
      required: true
  - type: input
    id: attribute
    attributes:
      label: Attribute id
      description: For example A3, if the challenge is attribute-level.
      placeholder: A3
    validations:
      required: false
  - type: dropdown
    id: target
    attributes:
      label: What are you challenging?
      options:
        - A calibration example
        - Pass criteria
        - Attribute text
        - A method rule (scoping, collection, Type II testing)
        - Something else
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
      description: The scenario where the current call reaches the wrong verdict.
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: What would be correct
    validations:
      required: false
